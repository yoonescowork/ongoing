<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 가계부</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>가계부</h1>
            <div>
                <button id="logoutBtn" class="icon-btn" title="로그아웃" style="display: none;">
                    <span class="material-icons-round">logout</span>
                </button>
                <button id="exportBtn" class="icon-btn" title="데이터 다운로드 (CSV)">
                    <span class="material-icons-round">file_download</span>
                </button>
                <button id="importBtn" class="icon-btn" title="CSV 불러오기">
                    <span class="material-icons-round">file_upload</span>
                </button>
            </div>
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
        </header>

        <!-- Main Content Area -->
        <main id="content">
            <!-- Home Tab -->
            <section id="tab-home" class="tab-content">
                <div class="summary-card glass">
                    <h2>이달의 총 지출</h2>
                    <p class="total-amount" id="homeTotalAmount">0원</p>
                </div>
                <div class="recent-transactions">
                    <h3>최근 내역</h3>
                    <ul id="recentList" class="transaction-list">
                        <!-- Items will be injected here -->
                    </ul>
                </div>
            </section>

            <!-- Calendar Tab -->
            <section id="tab-calendar" class="tab-content">
                <div class="calendar-container glass">
                    <div class="calendar-header">
                        <button id="prevMonthBtn" class="icon-btn"><span class="material-icons-round">chevron_left</span></button>
                        <h2 id="calendarMonthLabel">2024년 4월</h2>
                        <button id="nextMonthBtn" class="icon-btn"><span class="material-icons-round">chevron_right</span></button>
                    </div>
                    <div class="calendar-summary">
                        <span>이달 누적: <strong id="calMonthlyTotal" class="txn-amount">0원</strong></span>
                        <span>오늘까지: <strong id="calTodayTotal" class="txn-amount">0원</strong></span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid">
                        <!-- Calendar will be generated by JS -->
                    </div>
                </div>
            </section>

            <!-- Input Tab -->
            <section id="tab-input" class="tab-content active">
                <div class="form-container glass">
                    <h2>새 지출 입력</h2>
                    <form id="addTransactionForm">
                        <div class="form-group">
                            <label>날짜</label>
                            <!-- type="date" natively opens a calendar popup on mobile/desktop -->
                            <input type="date" id="inputDate" required>
                        </div>
                        <div class="form-group">
                            <label>카테고리</label>
                            <select id="inputCategory" required>
                                <option value="" disabled selected>선택해주세요</option>
                                <option value="식비/외식">식비/외식</option>
                                <option value="커피/간식">커피/간식</option>
                                <option value="장보기">장보기</option>
                                <option value="교통비">교통비</option>
                                <option value="쇼핑">쇼핑</option>
                                <option value="통신">통신</option>
                                <option value="병원/약국">병원/약국</option>
                                <option value="경조사/선물">경조사/선물</option>
                                <option value="여가/여행">여가/여행</option>
                                <option value="주거/공과금">주거/공과금</option>
                                <option value="금융/보험/저축">금융/보험/저축</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>내용</label>
                            <input type="text" id="inputDesc" placeholder="지출 내용" required>
                        </div>
                        <div class="form-group">
                            <label>금액</label>
                            <input type="number" id="inputAmount" placeholder="0" required>
                        </div>
                        <button type="submit" class="btn-primary">저장하기</button>
                    </form>
                </div>
            </section>

            <!-- Stats Tab -->
            <section id="tab-stats" class="tab-content">
                <div class="chart-container glass">
                    <h3>주별 지출</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="chart-container glass">
                    <h3>카테고리별 지출</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </section>

            <!-- AI Comment Tab -->
            <section id="tab-ai" class="tab-content">
                <div class="ai-card glass">
                    <div class="ai-header">
                        <span class="material-icons-round ai-icon">smart_toy</span>
                        <h2>AI 소비 분석</h2>
                    </div>
                    <div class="ai-content" id="aiCommentContent">
                        데이터를 분석하여 스마트한 소비 조언을 제공합니다.
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="home">
                <span class="material-icons-round">home</span>
                <span>홈</span>
            </button>
            <button class="nav-item" data-tab="calendar">
                <span class="material-icons-round">calendar_month</span>
                <span>달력</span>
            </button>
            <button class="nav-item active" data-tab="input">
                <span class="material-icons-round">add_circle</span>
                <span>입력</span>
            </button>
            <button class="nav-item" data-tab="stats">
                <span class="material-icons-round">bar_chart</span>
                <span>리포트</span>
            </button>
            <button class="nav-item" data-tab="ai">
                <span class="material-icons-round">auto_awesome</span>
                <span>AI</span>
            </button>
        </nav>

        <!-- Login Overlay -->
        <div id="loginOverlay" class="login-overlay active">
            <div class="login-card glass">
                <span class="material-icons-round login-icon">account_balance_wallet</span>
                <h2>스마트 가계부</h2>
                <p>기기 간 완벽한 동기화를 위해<br>구글 계정으로 로그인해주세요.</p>
                <button id="loginBtnOverlay" class="btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G" width="20" height="20">
                    구글 계정으로 시작하기
                </button>
                <button id="skipLoginBtn" class="btn-text">로그인 없이 오프라인으로 사용하기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
